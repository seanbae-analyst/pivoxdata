# Daily refresh of the dashboard (/, AI 기술 신호 레이더) and, when something big happened, an Instagram draft.
#   1. fetch → verify → build. If any check fails, nothing is committed and an issue lists the failing checks —
#      a wrong sentence is never published silently. build.mjs also looks for big cases (a leader change, a package
#      far above its usual week, a new all-time high, a phrase crossing 2.5× in papers, a new #1 model, a capex filing).
#      It also compares today's readings with yesterday's (trends/data/state.json) for small changes — a new #1, a new
#      entrant, a share moving 1%p, a month of papers counted, one company's filing — logged in changes.json.
#   2. social/plan.mjs decides whether today gets a draft: a big case not drafted before (its subject left alone for
#      21 days); else, a week after the last draft, a digest of 3+ small changes; else a roundup after 14 quiet days.
#      Otherwise only the site is refreshed.
#   3. A draft becomes carousel cards (social/build.mjs, render.mjs — a different drawing and layout each time) and a
#      caption (social/caption.mjs: Claude writes it, code checks every number against the cards and rejects
#      advice/forecast words), and is posted to Instagram right away; a closed "[게시됨]" issue records it.
#      With the repository variable AUTO_PUBLISH set to "false" (or on a forced test run, or when posting fails) an
#      "[instagram]" issue asks for approval instead, and the owner's /approve posts it (social-publish.yml).
name: trends daily

on:
  schedule:
    - cron: "17 1 * * *" # every day 01:17 UTC (10:17 KST), after npm/PyPI have counted the day before
  workflow_dispatch:
    inputs:
      post:
        description: "인스타그램"
        type: choice
        default: "규칙대로"
        options: ["규칙대로", "누가 앞서나 지금 올리기", "테스트 초안 (승인 필요)"]

permissions:
  contents: write
  issues: write

concurrency:
  group: trends
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Fetch, verify, build
        shell: bash # -eo pipefail, so a failing step is not hidden by tee
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: npm run trends 2>&1 | tee run.log

      - name: Big case today?
        id: plan
        shell: bash
        env:
          POST_KIND: ${{ inputs.post == '누가 앞서나 지금 올리기' && 'race' || inputs.post == '테스트 초안 (승인 필요)' && 'test' || '' }}
        run: node social/plan.mjs 2>&1 | tee -a run.log

      # the caption is written by Claude through the Claude Code CLI on a subscription token (CLAUDE_CODE_OAUTH_TOKEN,
      # from `claude setup-token`); an API key (ANTHROPIC_API_KEY) also works; with neither, a template caption is used
      - name: Install Claude Code
        if: steps.plan.outputs.post == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Instagram cards and caption
        if: steps.plan.outputs.post == 'true'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node social/build.mjs 2>&1 | tee -a run.log
          node social/render.mjs 2>&1 | tee -a run.log
          node social/caption.mjs 2>&1 | tee -a run.log

      - name: Commit refreshed data, page and cards
        id: commit
        run: |
          git config user.name "pivoxdata-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trends/data index.html map.html 404.html sitemap.xml robots.txt social/cards.html social/out social/posted.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data(trends): daily refresh $(date -u +%F)${{ steps.plan.outputs.post == 'true' && ' + instagram draft' || '' }}"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push # the publish job may have pushed meanwhile
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # automatic posting (the default): a draft that passed the caption checks is posted right away, after the commit
      # above has put its images on the site. Set the repository variable AUTO_PUBLISH to "false" to go back to
      # approving each post. A test draft (Run workflow → "테스트 초안") always waits for approval. If posting fails, the draft
      # falls back to an approval issue, so nothing is lost.
      - name: Post to Instagram automatically
        id: auto
        if: steps.plan.outputs.post == 'true' && steps.commit.outputs.changed == 'true' && vars.AUTO_PUBLISH != 'false' && inputs.post != '테스트 초안 (승인 필요)'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
        run: |
          test -n "$IG_USER_ID" && test -n "$IG_ACCESS_TOKEN" || { echo "IG_USER_ID / IG_ACCESS_TOKEN secrets are not set"; exit 1; }
          file="social/out/${{ steps.plan.outputs.date }}/post.json"
          node social/publish.mjs "$file"
          git add "$file" && git commit -m "social: published ${{ steps.plan.outputs.date }} (automatic)" && git pull --rebase origin "${GITHUB_REF_NAME}" && git push

      - name: Report the post, or ask for approval
        if: steps.plan.outputs.post == 'true' && steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          POST_DATE: ${{ steps.plan.outputs.date }}
          AUTO: ${{ steps.auto.outcome }}
        with:
          script: |
            const fs = require("fs");
            const date = process.env.POST_DATE;
            const post = JSON.parse(fs.readFileSync(`social/out/${date}/post.json`, "utf8"));
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const imgs = post.images.map((f) => `<img src="${post.image_base}${f}" width="270">`).join(" ");
            const body = [
              `<!-- instagram-post:${date} -->`,
              post.mode === "event" ? `**빅 케이스 (${post.event.kind})** — ${post.event.headline}`
                : post.mode === "digest" ? `**작은 변화 ${post.insights.length}가지** — 지난 한 주 동안 잡힌 것을 모았습니다.`
                : post.mode === "race" ? "**누가 앞서나** — AI 분야별 1위와 그 변화."
                : "**묶음** — 14일 동안 올릴 변화가 없어 요즘 숫자를 모았습니다.",
              "",
              `인스타그램 캐러셀${post.published ? "" : " 초안"}입니다 (${post.images.length}장, 캡션: ${post.caption_source === "claude" ? `Claude ${post.caption_model} via ${post.caption_via} — 숫자·금지어 검사 통과` : `템플릿 — ${post.caption_note}`}).`,
              ...(post.published ? [] : [`이미지는 사이트 배포가 끝나면(1~2분) 보입니다.`]),
              "", imgs, "", "**캡션**", "```", post.caption, "```", "",
              ...(post.published ? [`**자동으로 게시했습니다:** ${post.published.permalink}`, "", "내리려면 인스타그램 앱에서 직접 삭제하세요. 자동 게시를 끄려면 저장소 변수 `AUTO_PUBLISH`를 `false`로."]
                : [...(process.env.AUTO === "failure" ? [`⚠️ 자동 게시가 실패해 승인으로 돌렸습니다. 로그: ${run}`, ""] : []),
                   "- `/approve` — 이대로 게시 (저장소 소유자만)",
                   "- `/reject` — 게시하지 않음 (같은 대상은 21일 동안 다시 초안을 만들지 않습니다)"]),
            ].join("\n");
            const what = post.mode === "event" ? `빅 케이스 — ${post.event.headline}` : post.mode === "digest" ? `작은 변화 ${post.insights.length}가지` : post.mode === "race" ? "누가 앞서나" : "요즘 AI 기술 신호";
            const title = post.published ? `[게시됨] ${date} ${what}` : `[instagram] ${date} ${what}`;
            const issue = await github.rest.issues.create({ ...context.repo, title: title.slice(0, 200), body });
            // a posted draft is a record, not a question: closed at once (it still notifies the owner)
            if (post.published) await github.rest.issues.update({ ...context.repo, issue_number: issue.data.number, state: "closed", state_reason: "completed" });

      - name: Open an issue when a check fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const log = fs.existsSync("run.log") ? fs.readFileSync("run.log", "utf8") : "(no log)";
            const failed = log.split("\n").filter((l) => l.startsWith("✗") || /Error|STOPPED|failed/.test(l)).join("\n") || log.slice(-3000);
            const body = `The daily trends job did not publish because a step failed.\n\n\`\`\`\n${failed.slice(0, 6000)}\n\`\`\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // one open issue at a time: a failure that repeats daily adds a comment instead of a new issue
            const open = (await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 50 })).data.find((i) => i.title.startsWith("trends: daily refresh stopped"));
            if (open) await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body: `Again on ${new Date().toISOString().slice(0, 10)}.\n\n${body}` });
            else await github.rest.issues.create({ ...context.repo, title: `trends: daily refresh stopped (${new Date().toISOString().slice(0, 10)})`, body });

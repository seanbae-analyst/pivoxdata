# Weekly refresh of the dashboard (/, AI 기술 신호 레이더) and the Instagram draft.
#   1. fetch → verify → build. If any check fails, nothing is committed and an issue lists the failing checks —
#      a wrong sentence is never published silently.
#   2. The same insights become carousel cards (social/build.mjs, render.mjs) and a caption (social/caption.mjs:
#      Claude writes it, code checks every number against the data and rejects advice/forecast words).
#   3. Data, page and cards are committed to main (Vercel publishes them), and an "[instagram]" issue asks for
#      approval. Nothing is posted until the repository owner comments /approve (social-publish.yml).
name: trends weekly

on:
  schedule:
    - cron: "17 1 * * 1" # Mondays 01:17 UTC (10:17 KST), after npm/PyPI have counted Sunday
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: trends
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Fetch, verify, build
        shell: bash # -eo pipefail, so a failing step is not hidden by tee
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: npm run trends 2>&1 | tee run.log

      - name: Instagram cards and caption
        id: social
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node social/build.mjs 2>&1 | tee -a run.log
          node social/render.mjs 2>&1 | tee -a run.log
          node social/caption.mjs 2>&1 | tee -a run.log
          echo "date=$(node -p 'require("./trends/data/insights.json").built_at')" >> "$GITHUB_OUTPUT"

      - name: Commit refreshed data, page and cards
        id: commit
        run: |
          git config user.name "pivoxdata-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trends/data index.html map.html 404.html sitemap.xml robots.txt social/cards.html social/out
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data(trends): weekly refresh $(date -u +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ask for approval to post
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          POST_DATE: ${{ steps.social.outputs.date }}
        with:
          script: |
            const fs = require("fs");
            const date = process.env.POST_DATE;
            const post = JSON.parse(fs.readFileSync(`social/out/${date}/post.json`, "utf8"));
            if (post.published) return;
            const imgs = post.images.map((f) => `<img src="${post.image_base}${f}" width="270">`).join(" ");
            const body = [
              `<!-- instagram-post:${date} -->`,
              `이번 주 인스타그램 캐러셀 초안입니다 (${post.images.length}장, 캡션: ${post.caption_source === "claude" ? `Claude ${post.caption_model} — 숫자·금지어 검사 통과` : `템플릿 — ${post.caption_note}`}).`,
              `이미지는 사이트 배포가 끝나면(1~2분) 보입니다.`,
              "", imgs, "", "**캡션**", "```", post.caption, "```", "",
              "- `/approve` — 이대로 게시 (저장소 소유자만)",
              "- `/reject` — 이번 주는 게시하지 않음",
            ].join("\n");
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: `[instagram] ${date} 주간 AI 기술 신호`, body });

      - name: Open an issue when a check fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const log = fs.existsSync("run.log") ? fs.readFileSync("run.log", "utf8") : "(no log)";
            const failed = log.split("\n").filter((l) => l.startsWith("✗") || /Error|STOPPED|failed/.test(l)).join("\n") || log.slice(-3000);
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `trends: weekly refresh stopped (${new Date().toISOString().slice(0, 10)})`,
              body: `The weekly trends job did not publish because a step failed.\n\n\`\`\`\n${failed.slice(0, 6000)}\n\`\`\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

# Daily refresh of the dashboard (/, AI 기술 신호 레이더) and, when something big happened, an Instagram draft.
#   1. fetch → verify → build. If any check fails, nothing is committed and an issue lists the failing checks —
#      a wrong sentence is never published silently. build.mjs also looks for big cases (a leader change, a package
#      far above its usual week, a new all-time high, a phrase crossing 2.5× in papers, a new #1 model, a capex filing).
#      It also compares today's readings with yesterday's (trends/data/state.json) for small changes — a new #1, a new
#      entrant, a share moving 1%p, a month of papers counted, one company's filing — logged in changes.json.
#   2. social/plan.mjs decides whether today gets a draft: a big case not drafted before (its subject left alone for
#      21 days); else, a week after the last draft, a digest of 3+ small changes; else a roundup after 14 quiet days.
#      Otherwise only the site is refreshed.
#   3. A draft becomes carousel cards (social/build.mjs, render.mjs — a different drawing and layout each time) and a
#      caption (social/caption.mjs: Claude writes it, code checks every number against the cards and rejects
#      advice/forecast words); an "[instagram]" issue asks for approval. Nothing is posted until the repository owner
#      comments /approve (social-publish.yml).
name: trends daily

on:
  schedule:
    - cron: "17 1 * * *" # every day 01:17 UTC (10:17 KST), after npm/PyPI have counted the day before
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: trends
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Fetch, verify, build
        shell: bash # -eo pipefail, so a failing step is not hidden by tee
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: npm run trends 2>&1 | tee run.log

      - name: Big case today?
        id: plan
        shell: bash
        run: node social/plan.mjs 2>&1 | tee -a run.log

      - name: Instagram cards and caption
        if: steps.plan.outputs.post == 'true'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node social/build.mjs 2>&1 | tee -a run.log
          node social/render.mjs 2>&1 | tee -a run.log
          node social/caption.mjs 2>&1 | tee -a run.log

      - name: Commit refreshed data, page and cards
        id: commit
        run: |
          git config user.name "pivoxdata-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trends/data index.html map.html 404.html sitemap.xml robots.txt social/cards.html social/out social/posted.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data(trends): daily refresh $(date -u +%F)${{ steps.plan.outputs.post == 'true' && ' + instagram draft' || '' }}"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push # the publish job may have pushed meanwhile
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ask for approval to post
        if: steps.plan.outputs.post == 'true' && steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          POST_DATE: ${{ steps.plan.outputs.date }}
        with:
          script: |
            const fs = require("fs");
            const date = process.env.POST_DATE;
            const post = JSON.parse(fs.readFileSync(`social/out/${date}/post.json`, "utf8"));
            if (post.published) return;
            const imgs = post.images.map((f) => `<img src="${post.image_base}${f}" width="270">`).join(" ");
            const body = [
              `<!-- instagram-post:${date} -->`,
              post.mode === "event" ? `**빅 케이스 (${post.event.kind})** — ${post.event.headline}`
                : post.mode === "digest" ? `**작은 변화 ${post.insights.length}가지** — 지난 한 주 동안 잡힌 것을 모았습니다.`
                : "**묶음** — 14일 동안 올릴 변화가 없어 요즘 숫자를 모았습니다.",
              "",
              `인스타그램 캐러셀 초안입니다 (${post.images.length}장, 캡션: ${post.caption_source === "claude" ? `Claude ${post.caption_model} — 숫자·금지어 검사 통과` : `템플릿 — ${post.caption_note}`}).`,
              `이미지는 사이트 배포가 끝나면(1~2분) 보입니다.`,
              "", imgs, "", "**캡션**", "```", post.caption, "```", "",
              "- `/approve` — 이대로 게시 (저장소 소유자만)",
              "- `/reject` — 게시하지 않음 (같은 대상은 21일 동안 다시 초안을 만들지 않습니다)",
            ].join("\n");
            const title = post.mode === "event" ? `[instagram] ${date} 빅 케이스 — ${post.event.headline}`
              : post.mode === "digest" ? `[instagram] ${date} 작은 변화 ${post.insights.length}가지` : `[instagram] ${date} 요즘 AI 기술 신호`;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: title.slice(0, 200), body });

      - name: Open an issue when a check fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const log = fs.existsSync("run.log") ? fs.readFileSync("run.log", "utf8") : "(no log)";
            const failed = log.split("\n").filter((l) => l.startsWith("✗") || /Error|STOPPED|failed/.test(l)).join("\n") || log.slice(-3000);
            const body = `The daily trends job did not publish because a step failed.\n\n\`\`\`\n${failed.slice(0, 6000)}\n\`\`\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // one open issue at a time: a failure that repeats daily adds a comment instead of a new issue
            const open = (await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 50 })).data.find((i) => i.title.startsWith("trends: daily refresh stopped"));
            if (open) await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body: `Again on ${new Date().toISOString().slice(0, 10)}.\n\n${body}` });
            else await github.rest.issues.create({ ...context.repo, title: `trends: daily refresh stopped (${new Date().toISOString().slice(0, 10)})`, body });

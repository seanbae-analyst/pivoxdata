# Posts an approved carousel to Instagram — or records the owner's /reject.
# Runs when the repository OWNER comments /approve (or /reject) on an open "[instagram]" issue that trends.yml opened
# (the issue's author must be github-actions[bot] and its body unedited: the post's folder is read only from that
# bot-written marker) — or from Actions → "instagram publish" → Run workflow with a folder name (a post made by hand,
# e.g. the pinned brand posts; only people with write access can run it). The post itself is
# social/out/<slot>/post.json, already committed; this job only sends it (publish.mjs reads the account's recent media
# first, so a post that is already up is recorded, never posted twice), then lists its briefing (briefs.mjs) in the
# same push. An open "[instagram]" issue carrying the same marker is closed with the link.
# A hand-made post can also go up on its own: commit its post.json with "auto_publish": true and, once it reaches main,
# the publish-queued job posts every such unpublished folder in slot order (merging the PR is the approval).
name: instagram publish

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths: ["social/out/**/post.json"]
  workflow_dispatch:
    inputs:
      slot:
        description: "social/out/<폴더>/post.json 을 바로 게시 (예: 2026-10-25-91)"
        required: true

permissions:
  contents: write
  issues: write

# no workflow-level concurrency: every comment on any issue starts this workflow, and a run whose job is skipped would
# still take the group's one waiting place — cancelling an /approve that was waiting there. The jobs that post join
# the group instead, with trends.yml's automatic posting: one post goes up at a time.
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == 'github-actions[bot]' &&
      startsWith(github.event.issue.title, '[instagram]') &&
      github.event.comment.author_association == 'OWNER' &&
      (startsWith(github.event.comment.body, '/approve') || startsWith(github.event.comment.body, '/reject')))
    runs-on: ubuntu-latest
    timeout-minutes: 30 # publish.mjs: at most ~18 min (10 for the images to appear, 5 + 2.5 for the containers)
    concurrency:
      group: instagram-publish
      cancel-in-progress: false
    env:
      PUSH_BRANCH: main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Which post
        id: post
        uses: actions/github-script@v7
        with:
          script: |
            const SLOT = /^\d{4}-\d{2}-\d{2}(?:-\d+)?$/; // the same shape as social/slot.mjs → SLOT
            if (context.eventName === "workflow_dispatch") {
              const slot = (context.payload.inputs?.slot || "").trim();
              if (!SLOT.test(slot)) core.setFailed(`slot must look like YYYY-MM-DD or YYYY-MM-DD-N, got "${slot}"`);
              core.setOutput("date", SLOT.test(slot) ? slot : "");
              core.setOutput("action", "approve");
              return;
            }
            // only an issue the workflow's bot opened (trends.yml) and nobody has edited since counts: anyone can open
            // an "[instagram]" issue, and a marker changed after the owner looked would post a different folder
            const { repository: { issue } } = await github.graphql(
              "query($owner: String!, $repo: String!, $n: Int!) { repository(owner: $owner, name: $repo) { issue(number: $n) { lastEditedAt body } } }",
              { owner: context.repo.owner, repo: context.repo.repo, n: context.issue.number });
            const bot = context.payload.issue.user?.login === "github-actions[bot]" && context.payload.issue.user?.type === "Bot";
            if (!bot || issue.lastEditedAt) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: `이 이슈로는 승인할 수 없습니다: 워크플로가 연 그대로의 승인 이슈만 받습니다(본문 수정 ${issue.lastEditedAt ?? "없음"}). 다시 게시하려면 Actions → instagram publish → Run workflow 에 폴더 이름을 넣으세요.` });
              core.setFailed(`not an unedited approval issue from the workflow (author ${context.payload.issue.user?.login}, edited ${issue.lastEditedAt ?? "never"})`); core.setOutput("date", ""); return;
            }
            const m = (issue.body || "").match(/<!-- instagram-post:(\d{4}-\d{2}-\d{2}(?:-\d+)?) -->/);
            if (!m) core.setFailed("no <!-- instagram-post:YYYY-MM-DD --> marker in the issue");
            core.setOutput("date", m ? m[1] : "");
            core.setOutput("action", context.payload.comment.body.startsWith("/approve") ? "approve" : "reject");

      # /reject: post.json → rejected (nothing posts it later), and its briefing page goes (briefs.mjs makes none for it)
      - name: Reject
        if: steps.post.outputs.action == 'reject' && steps.post.outputs.date != ''
        shell: bash # -eo pipefail: a failure is not hidden by tee
        env:
          SLOT: ${{ steps.post.outputs.date }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node social/publish.mjs "social/out/$SLOT/post.json" --reject | tee result.txt
          node social/commit.mjs -m "social: rejected $SLOT" "social/out/$SLOT/post.json"
          node social/commit.mjs --briefs -m "briefs: $SLOT rejected — its page removed"

      - name: Close the rejected issue
        if: steps.post.outputs.action == 'reject' && steps.post.outputs.date != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const said = fs.existsSync("result.txt") ? fs.readFileSync("result.txt", "utf8") : "";
            const done = said.startsWith("already published");
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: done ? `이미 게시된 게시물이라 거절하지 않았습니다 (${said.replace(/^already published: | — .*$/gs, "").trim()}). 내리려면 인스타그램 앱에서 직접 삭제하세요.` : "게시하지 않습니다. 브리핑 페이지도 지웠습니다." });
            await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, state: "closed", state_reason: done ? "completed" : "not_planned" });

      - name: Publish
        if: steps.post.outputs.action == 'approve' && steps.post.outputs.date != ''
        shell: bash # -eo pipefail: a failure is not hidden by tee
        env:
          SLOT: ${{ steps.post.outputs.date }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -n "$IG_USER_ID" && test -n "$IG_ACCESS_TOKEN" || { echo "IG_USER_ID / IG_ACCESS_TOKEN secrets are not set — see social/README.md"; exit 1; }
          node social/publish.mjs "social/out/$SLOT/post.json" | tee result.txt
          node social/commit.mjs -m "social: published $SLOT" "social/out/$SLOT/post.json"
          node social/commit.mjs --briefs -m "briefs: $SLOT is on Instagram — listed"

      # also when it was up already (a second /approve, a post already published): close the issue with its link
      - name: Record and report
        if: steps.post.outputs.action == 'approve' && steps.post.outputs.date != ''
        uses: actions/github-script@v7
        env:
          POST_DATE: ${{ steps.post.outputs.date }}
        with:
          script: |
            const fs = require("fs");
            const post = JSON.parse(fs.readFileSync(`social/out/${process.env.POST_DATE}/post.json`, "utf8"));
            const said = fs.existsSync("result.txt") ? fs.readFileSync("result.txt", "utf8") : "";
            const link = post.published.permalink ?? `media ${post.published.media_id}`;
            const note = said.startsWith("already published") ? `이미 게시돼 있었습니다: ${link}`
              : said.startsWith("already on Instagram") ? `인스타그램에 이미 올라가 있어 다시 올리지 않고 기록만 남겼습니다: ${link}`
              : `게시했습니다: ${link}`;
            // the approving issue, or (Run workflow) any open "[instagram]" issue that carries this post's marker
            const marker = `<!-- instagram-post:${process.env.POST_DATE} -->`;
            const issues = context.eventName === "workflow_dispatch"
              ? (await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: "open", per_page: 100 }))
                  .filter((i) => !i.pull_request && i.title.startsWith("[instagram]") && (i.body || "").includes(marker)).map((i) => i.number)
              : [context.issue.number];
            for (const n of issues) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: n, body: note });
              await github.rest.issues.update({ ...context.repo, issue_number: n, state: "closed", state_reason: "completed" });
            }
            core.notice(`${process.env.POST_DATE}: ${note}`);

      - name: Report a failure
        if: failure() && github.event_name == 'issue_comment' && steps.post.outputs.date != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: `처리하지 못했습니다. 로그: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n고친 뒤 \`/approve\`(또는 \`/reject\`)를 다시 남기면 다시 시도합니다. 이미 올라간 게시물은 다시 올리지 않습니다.` });

  # Hand-made posts committed with "auto_publish": true (e.g. the pinned brand posts) — published in slot order
  # (social/slot.mjs: 2026-10-25-2 before 2026-10-25-10), one at a time. The bot's own commits use GITHUB_TOKEN,
  # which does not start another run.
  publish-queued:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90 # each post at most ~18 min (publish.mjs); usually seconds, the images being up already
    concurrency:
      group: instagram-publish
      cancel-in-progress: false
    env:
      PUSH_BRANCH: main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish queued posts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          queued=$(node social/publish.mjs --queued)
          if [ -z "$queued" ]; then echo "nothing queued"; exit 0; fi
          test -n "$IG_USER_ID" && test -n "$IG_ACCESS_TOKEN" || { echo "IG_USER_ID / IG_ACCESS_TOKEN secrets are not set — see social/README.md"; exit 1; }
          for f in $queued; do
            slot=$(basename "$(dirname "$f")")
            node social/publish.mjs "$f"
            node social/commit.mjs -m "social: published $slot" "$f"
            echo "$slot" >> "$RUNNER_TEMP/published.txt"
          done
          node social/commit.mjs --briefs -m "briefs: queued posts are on Instagram — listed"

      - name: Close their issues
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const list = `${process.env.RUNNER_TEMP}/published.txt`;
            if (!fs.existsSync(list)) return;
            const open = (await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: "open", per_page: 100 }))
              .filter((i) => !i.pull_request && i.title.startsWith("[instagram]"));
            for (const slot of fs.readFileSync(list, "utf8").split("\n").filter(Boolean)) {
              const post = JSON.parse(fs.readFileSync(`social/out/${slot}/post.json`, "utf8"));
              const link = post.published?.permalink ?? post.published?.media_id;
              core.notice(`published ${slot}: ${link}`);
              for (const i of open.filter((i) => (i.body || "").includes(`<!-- instagram-post:${slot} -->`))) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: `게시했습니다: ${link}` });
                await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: "closed", state_reason: "completed" });
              }
            }

# Posts an approved carousel (a big case or a roundup) to Instagram.
# Runs when the repository OWNER comments /approve (or /reject) on an open "[instagram]" issue opened by
# trends.yml — or from Actions → "instagram publish" → Run workflow with a folder name (a post made by hand, e.g. the
# pinned brand posts; only people with write access can run it). The post itself is social/out/<slot>/post.json,
# already committed; this job only sends it. An open "[instagram]" issue carrying the same marker is closed with the link.
name: instagram publish

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      slot:
        description: "social/out/<폴더>/post.json 을 바로 게시 (예: 2026-10-25-91)"
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' || (
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.issue.title, '[instagram]') &&
      github.event.comment.author_association == 'OWNER' &&
      (startsWith(github.event.comment.body, '/approve') || startsWith(github.event.comment.body, '/reject')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Which week
        id: post
        uses: actions/github-script@v7
        with:
          script: |
            const SLOT = /^\d{4}-\d{2}-\d{2}(?:-\d+)?$/;
            if (context.eventName === "workflow_dispatch") {
              const slot = (context.payload.inputs?.slot || "").trim();
              if (!SLOT.test(slot)) core.setFailed(`slot must look like YYYY-MM-DD or YYYY-MM-DD-N, got "${slot}"`);
              core.setOutput("date", SLOT.test(slot) ? slot : "");
              core.setOutput("action", "approve");
              return;
            }
            const m = (context.payload.issue.body || "").match(/<!-- instagram-post:(\d{4}-\d{2}-\d{2}(?:-\d+)?) -->/);
            if (!m) core.setFailed("no <!-- instagram-post:YYYY-MM-DD --> marker in the issue");
            core.setOutput("date", m ? m[1] : "");
            core.setOutput("action", context.payload.comment.body.startsWith("/approve") ? "approve" : "reject");

      - name: Reject
        if: steps.post.outputs.action == 'reject'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: "게시하지 않습니다." });
            await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, state: "closed", state_reason: "not_planned" });

      - name: Publish
        if: steps.post.outputs.action == 'approve'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
        run: |
          test -n "$IG_USER_ID" && test -n "$IG_ACCESS_TOKEN" || { echo "IG_USER_ID / IG_ACCESS_TOKEN secrets are not set — see social/README.md"; exit 1; }
          node social/publish.mjs "social/out/${{ steps.post.outputs.date }}/post.json"

      - name: Record and report
        if: steps.post.outputs.action == 'approve'
        uses: actions/github-script@v7
        env:
          POST_DATE: ${{ steps.post.outputs.date }}
        with:
          script: |
            const { execSync } = require("child_process");
            const fs = require("fs");
            const file = `social/out/${process.env.POST_DATE}/post.json`;
            const post = JSON.parse(fs.readFileSync(file, "utf8"));
            execSync(`git config user.name "pivoxdata-bot" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add ${file} && git commit -m "social: published ${process.env.POST_DATE}" && git pull --rebase && git push`);
            // the approving issue, or (Run workflow) any open "[instagram]" issue that carries this post's marker
            const marker = `<!-- instagram-post:${process.env.POST_DATE} -->`;
            const issues = context.eventName === "workflow_dispatch"
              ? (await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: "open", per_page: 100 }))
                  .filter((i) => !i.pull_request && i.title.startsWith("[instagram]") && (i.body || "").includes(marker)).map((i) => i.number)
              : [context.issue.number];
            for (const n of issues) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: n, body: `게시했습니다: ${post.published.permalink}` });
              await github.rest.issues.update({ ...context.repo, issue_number: n, state: "closed", state_reason: "completed" });
            }
            core.notice(`published ${process.env.POST_DATE}: ${post.published.permalink}`);

      - name: Report a failure
        if: failure() && steps.post.outputs.action == 'approve' && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: `게시하지 못했습니다. 로그: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n고친 뒤 \`/approve\`를 다시 남기면 다시 시도합니다.` });
